{% extends "layout.html" %} {% block content %}
<script type="text/javascript">
  const playerName = {{ player_name | dump | safe }};
  const protocol = location.protocol === "https:" ? "wss:" : "ws:";
  const ws = new WebSocket(`${protocol}//${location.host}/ws`);
  let messagesContainer;
  let messageInput;

  ws.addEventListener("message", function (event) {
    addStoryLine(event.data);
    scrollToBottom();
  });

  ws.addEventListener("open", function () {
    console.log("WebSocket connection established");
  });

  ws.addEventListener("error", function (error) {
    console.error("WebSocket error:", error);
  });

  ws.addEventListener("close", function () {
    console.log("WebSocket connection closed");
  });

  // Keep connection alive
  setInterval(() => {
    if (ws.readyState === WebSocket.OPEN) {
      ws.send("");
    }
  }, 33000);

  function sendMessage(event) {
    event.preventDefault();
    const message = messageInput.value.trim();
    if (message) {
      addCommandLine(message);
      scrollToBottom();
      ws.send(message);
      messageInput.value = "";
      autoResizeInput();
    }
    messageInput.focus();
    return false;
  }

  function escapeHTML(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  function addStoryLine(message) {
    const line = document.createElement("div");
    line.className = "story-line";
    line.innerHTML = escapeHTML(message).replace(/\n/g, "<br/>");
    messagesContainer.appendChild(line);
  }

  function addCommandLine(message) {
    const line = document.createElement("div");
    line.className = "command-line";
    const label = document.createElement("span");
    label.className = "command-player";
    label.textContent = playerName;
    line.appendChild(label);
    line.appendChild(document.createTextNode(message));
    messagesContainer.appendChild(line);
  }

  function scrollToBottom() {
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
  }

  function autoResizeInput() {
    messageInput.style.height = "auto";
    messageInput.style.height = `${Math.min(messageInput.scrollHeight, 160)}px`;
  }

  // iOS Safari detection
  function isIOS() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  }

  // Handle iOS Safari viewport adjustments
  function handleIOSViewport() {
    if (isIOS()) {
      document.body.classList.add("ios-safari");

      // Handle viewport height changes
      let vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty("--vh", `${vh}px`);

      window.addEventListener("resize", () => {
        vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty("--vh", `${vh}px`);
      });
    }
  }

  // Initialize everything when DOM is loaded
  document.addEventListener("DOMContentLoaded", function () {
    messagesContainer = document.getElementById("messages");
    messageInput = document.getElementById("message-input");

    handleIOSViewport();

    // Enter sends; Shift+Enter inserts a newline
    messageInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter" && !event.shiftKey) {
        sendMessage(event);
      }
    });

    messageInput.addEventListener("input", autoResizeInput);

    // Enhanced focus handling for mobile
    messageInput.addEventListener("focus", function () {
      if (isIOS()) {
        // Small delay to ensure keyboard is shown
        setTimeout(() => {
          scrollToBottom();
        }, 300);
      }
    });

    autoResizeInput();
    scrollToBottom();
  });
</script>

<div class="chat-container">
  <div id="messages" class="messages-area"></div>

  <form class="input-area" onsubmit="return sendMessage(event)">
    <div class="input-shell">
      <textarea
        id="message-input"
        name="message"
        rows="1"
        placeholder="What do you do?"
        autocomplete="off"
        autofocus
      ></textarea>
      <button type="submit" class="send-button" aria-label="Send">&#8593;</button>
    </div>
  </form>
</div>
{% endblock %}
