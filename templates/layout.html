<!DOCTYPE html>
<html lang="en">
  <head>
    {% block head %}
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="MonkaMOO - A family-friendly learning MOO"
    />
    <link rel="stylesheet" href="/static/style.css" />
    <title>MonkaMOO</title>
    {% endblock %}
  </head>
  <body>
    <div id="header">
      <div class="header-title">MonkaMOO</div>
      {% if player_name %}
      <div class="header-user">
        <span id="username">{{ player_name }}</span>
        <a href="/logout">Logout</a>
      </div>
      {% endif %}
    </div>
    <div id="content">{% block content %}{% endblock %}</div>
    <div id="footer">{% block footer %}{% endblock %}</div>
  </body>
</html>
